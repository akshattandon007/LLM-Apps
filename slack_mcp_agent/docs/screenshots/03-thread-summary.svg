  <text x="88" y="221" fill="#ecb22e" font-size="11" font-weight="700" letter-spacing="0.5">TL;DR</text>
  <text x="88" y="243" fill="#e8e8e8" font-size="13">Team agrees enterprise tier should start at $2k/mo with SSO +</text>
  <text x="88" y="261" fill="#e8e8e8" font-size="13">audit logs. Open: SLA tier (99.9 vs 99.95). Decision needs you.</text>

