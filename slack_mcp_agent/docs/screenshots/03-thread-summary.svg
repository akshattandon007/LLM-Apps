  <text x="80" y="424" fill="#e8e8e8" font-size="13">• SLA: Marcus wants 99.9%, Legal pushing 99.95%. Budget impact ~$30k/yr.</text>
  <text x="80" y="444" fill="#e8e8e8" font-size="13">• Naming: "Business" vs "Enterprise" — marketing has not weighed in.</text>

