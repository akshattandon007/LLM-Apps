  <text x="68" y="306" fill="#2eb67d" font-size="12" font-weight="700" letter-spacing="0.5">DECISIONS MADE</text>
  <text x="80" y="328" fill="#e8e8e8" font-size="13">• Entry price: $2,000/mo (Nadia, Marcus, Sarah aligned)</text>
  <text x="80" y="348" fill="#e8e8e8" font-size="13">• SSO + SCIM + audit logs bundled at entry tier</text>
  <text x="80" y="368" fill="#e8e8e8" font-size="13">• No custom-contract clause below $5k/mo ARR</text>

