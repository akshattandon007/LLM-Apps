<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 600" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="820" height="600" fill="#1a1d21"/>

  <!-- Header -->
  <rect x="0" y="0" width="820" height="52" fill="#19171d"/>
  <circle cx="28" cy="26" r="14" fill="#611f69"/>
  <text x="28" y="31" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">PM</text>
  <text x="54" y="24" fill="#fff" font-size="15" font-weight="700">PM Agent</text>
  <text x="54" y="41" fill="#ababad" font-size="12">Direct message</text>

  <!-- Agent nudge -->
  <circle cx="36" cy="88" r="18" fill="#611f69"/>
  <text x="36" y="93" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">PM</text>
  <text x="68" y="85" fill="#e8e8e8" font-size="14" font-weight="700">PM Agent</text>
  <rect x="130" y="76" width="30" height="14" rx="3" fill="#262a2f" stroke="#35373b"/>
  <text x="145" y="86" fill="#9a9b9e" font-size="9" text-anchor="middle">APP</text>
  <text x="170" y="85" fill="#9a9b9e" font-size="12">9:00 AM</text>

  <text x="68" y="108" fill="#e8e8e8" font-size="14" font-weight="600">📬 2 DMs unanswered for &gt;24h</text>

  <!-- DM card 1 -->
  <rect x="68" y="124" width="700" height="96" rx="6" fill="#222529" stroke="#35373b"/>
  <rect x="68" y="124" width="4" height="96" fill="#e01e5a"/>
  <circle cx="92" cy="152" r="14" fill="#4a154b"/>
  <text x="92" y="157" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">JK</text>
  <text x="114" y="150" fill="#e8e8e8" font-size="13" font-weight="700">James Kline (Sales)</text>
  <text x="258" y="150" fill="#9a9b9e" font-size="11">sent 28h ago · still unread</text>
  <text x="114" y="172" fill="#bcbdbe" font-size="13">"Quick check — is the API tier change still shipping before</text>
  <text x="114" y="190" fill="#bcbdbe" font-size="13">Acme's renewal on the 15th? Need to tell them something."</text>
  <text x="114" y="210" fill="#9a9b9e" font-size="11" font-style="italic">Context: Acme = $1.2M ARR renewal · James has pinged twice</text>

  <!-- DM card 2 -->
  <rect x="68" y="234" width="700" height="78" rx="6" fill="#222529" stroke="#35373b"/>
  <rect x="68" y="234" width="4" height="78" fill="#e01e5a"/>
  <circle cx="92" cy="262" r="14" fill="#0b486b"/>
  <text x="92" y="267" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">LR</text>
  <text x="114" y="260" fill="#e8e8e8" font-size="13" font-weight="700">Lena Reyes (Design)</text>
  <text x="254" y="260" fill="#9a9b9e" font-size="11">sent 26h ago</text>
  <text x="114" y="282" fill="#bcbdbe" font-size="13">"v3 mocks are ready whenever you have 15 min — no rush, but</text>
  <text x="114" y="300" fill="#bcbdbe" font-size="13">eng needs the handoff by Thursday to hit sprint."</text>

  <text x="68" y="342" fill="#9a9b9e" font-size="12">Want me to draft replies? I can do both, or just one.</text>

  <!-- User reply -->
  <circle cx="36" cy="400" r="18" fill="#2eb67d"/>
  <text x="36" y="405" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">AS</text>
  <text x="68" y="397" fill="#e8e8e8" font-size="14" font-weight="700">Ashish (you)</text>
  <text x="138" y="397" fill="#9a9b9e" font-size="12">9:02 AM</text>
  <text x="68" y="420" fill="#e8e8e8" font-size="14">draft for James: yes, shipping on the 12th, I'll confirm with eng this</text>
  <text x="68" y="440" fill="#e8e8e8" font-size="14">morning. For Lena: IDK her timeline — ask her if Friday works.</text>

  <!-- Agent response -->
  <circle cx="36" cy="494" r="18" fill="#611f69"/>
  <text x="36" y="499" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">PM</text>
  <text x="68" y="491" fill="#e8e8e8" font-size="14" font-weight="700">PM Agent</text>
  <text x="142" y="491" fill="#9a9b9e" font-size="12">9:02 AM</text>
  <text x="68" y="514" fill="#e8e8e8" font-size="14">Both drafted. Queued as #63 (James) and #64 (Lena).</text>
  <text x="68" y="534" fill="#e8e8e8" font-size="14">I'll preview both at 9:17 AM · send at 9:32 AM if approved.</text>
  <text x="68" y="554" fill="#9a9b9e" font-size="12" font-style="italic">You'll have 15 minutes to edit or cancel either one.</text>
</svg>
