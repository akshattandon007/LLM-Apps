[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "foldermate"
version = "1.0.0"
description = "Organize your messy Downloads/Desktop folders by file type and/or date."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
foldermate = "foldermate.cli:main"

[tool.setuptools.packages.find]
include = ["foldermate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]