[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "schoolsift"
version = "0.1.0"
description = "Plain-language search over school paperwork — cited answers plus the dates and deadlines in your PDFs."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[tool.setuptools]
packages = ["schoolsift"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]