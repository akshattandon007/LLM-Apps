name: Bug Report
description: File a bug report
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to fill out this bug report.
  - type: input
    id: project
    attributes:
      label: Project
      description: Which project folder does this relate to?
      placeholder: ai-agents/my-project/
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug clearly.
      placeholder: When I try to X, the app does Y instead of Z.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we trigger this?
      placeholder: |
        1. Run `python project.py --flag`
        2. Enter "test input"
        3. See error
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Python / environment
      description: What Python version and OS?
      placeholder: Python 3.12, macOS 15
    validations:
      required: false