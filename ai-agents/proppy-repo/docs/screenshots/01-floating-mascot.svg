<svg width="800" height="480" viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif">
  <!-- browser chrome -->
  <rect width="800" height="480" rx="10" fill="#F0F0EC"/>
  <rect width="800" height="38" rx="10" fill="#E2E2E2"/>
  <rect x="0" y="28" width="800" height="10" fill="#E2E2E2"/>
  <circle cx="20" cy="19" r="6" fill="#FF5F57"/>
  <circle cx="38" cy="19" r="6" fill="#FFBD2E"/>
  <circle cx="56" cy="19" r="6" fill="#28C840"/>
  <rect x="80" y="9" width="560" height="20" rx="6" fill="white"/>
  <text x="360" y="23" text-anchor="middle" font-size="11" fill="#666">rightmove.co.uk/properties-for-sale/london</text>
  <!-- page content -->
  <text x="400" y="220" text-anchor="middle" font-family="system-ui" font-size="42" font-weight="900" fill="#1CB0F6">Rightmove</text>
  <text x="400" y="255" text-anchor="middle" font-size="15" fill="#999">Property for sale in London</text>
  <!-- fake listings -->
  <rect x="60" y="290" width="200" height="120" rx="8" fill="white" stroke="#DDD" stroke-width="1"/>
  <rect x="60" y="290" width="200" height="60" rx="8" fill="#E0F0E0"/>
  <text x="160" y="372" text-anchor="middle" font-size="12" font-weight="600" fill="#333">3 bed flat, Hackney</text>
  <text x="160" y="390" text-anchor="middle" font-size="13" font-weight="700" fill="#1CB0F6">£485,000</text>
  <rect x="290" y="290" width="200" height="120" rx="8" fill="white" stroke="#DDD" stroke-width="1"/>
  <rect x="290" y="290" width="200" height="60" rx="8" fill="#E0E8F0"/>
  <text x="390" y="372" text-anchor="middle" font-size="12" font-weight="600" fill="#333">2 bed flat, Islington</text>
  <text x="390" y="390" text-anchor="middle" font-size="13" font-weight="700" fill="#1CB0F6">£420,000</text>
  <rect x="520" y="290" width="200" height="120" rx="8" fill="white" stroke="#DDD" stroke-width="1"/>
  <rect x="520" y="290" width="200" height="60" rx="8" fill="#F0E8E0"/>
  <text x="620" y="372" text-anchor="middle" font-size="12" font-weight="600" fill="#333">4 bed house, Peckham</text>
  <text x="620" y="390" text-anchor="middle" font-size="13" font-weight="700" fill="#1CB0F6">£650,000</text>
  <!-- Proppy mascot floating bottom right -->
  <!-- shadow -->
  <ellipse cx="708" cy="452" rx="30" ry="6" fill="#1CB0F6" opacity="0.1"/>
  <!-- ears -->
  <circle cx="678" cy="388" r="18" fill="#A0C4D8"/>
  <circle cx="678" cy="388" r="11" fill="#C8E6F0"/>
  <circle cx="678" cy="388" r="7"  fill="#E8F6FF" opacity=".75"/>
  <circle cx="738" cy="388" r="18" fill="#A0C4D8"/>
  <circle cx="738" cy="388" r="11" fill="#C8E6F0"/>
  <circle cx="738" cy="388" r="7"  fill="#E8F6FF" opacity=".75"/>
  <!-- body -->
  <ellipse cx="708" cy="436" rx="32" ry="30" fill="#1CB0F6"/>
  <ellipse cx="708" cy="443" rx="20" ry="18" fill="#E8F6FF" opacity=".85"/>
  <!-- head -->
  <circle cx="708" cy="400" r="30" fill="#1CB0F6"/>
  <!-- hat -->
  <polygon points="708,368 684,390 732,390" fill="#FF9600"/>
  <rect x="720" y="372" width="8" height="14" rx="2" fill="#333" opacity=".88"/>
  <!-- nose -->
  <ellipse cx="708" cy="406" rx="11" ry="7.5" fill="#1A1A2E"/>
  <ellipse cx="705" cy="403" rx="3" ry="2" fill="rgba(255,255,255,.35)"/>
  <!-- eyes -->
  <circle cx="695" cy="396" r="11" fill="white"/>
  <circle cx="721" cy="396" r="11" fill="white"/>
  <circle cx="696" cy="397" r="7"  fill="#2C1A0E"/>
  <circle cx="722" cy="397" r="7"  fill="#2C1A0E"/>
  <circle cx="694" cy="395" r="2.5" fill="white"/>
  <circle cx="720" cy="395" r="2.5" fill="white"/>
  <!-- brows -->
  <path d="M685 387 Q694 381 702 385" fill="none" stroke="#0A2040" stroke-width="3.5" stroke-linecap="round" opacity=".8"/>
  <path d="M714 385 Q722 381 731 387" fill="none" stroke="#0A2040" stroke-width="3.5" stroke-linecap="round" opacity=".8"/>
  <!-- smile -->
  <path d="M699 411 Q708 418 717 411" fill="none" stroke="#0A2040" stroke-width="2" stroke-linecap="round" opacity=".7"/>
  <!-- notification badge -->
  <circle cx="738" cy="376" r="12" fill="#FF4B4B"/>
  <text x="738" y="380" text-anchor="middle" font-size="11" font-weight="900" fill="white">2</text>
  <!-- tooltip -->
  <rect x="570" y="358" width="116" height="26" rx="13" fill="#1A1A2E"/>
  <text x="628" y="375" text-anchor="middle" font-size="11" font-weight="700" fill="white">Find your dream home</text>
  <!-- label arrow -->
  <text x="560" y="430" font-size="12" fill="#666">← Click to open Proppy</text>
</svg>
