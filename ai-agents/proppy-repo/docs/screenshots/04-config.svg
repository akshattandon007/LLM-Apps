<svg width="800" height="560" viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif">
  <rect width="800" height="560" fill="#F0EEE8"/>
  <rect x="228" y="26" width="364" height="524" rx="22" fill="rgba(0,0,0,.18)"/>
  <rect x="224" y="22" width="364" height="524" rx="22" fill="#F5F5F5"/>
  <rect x="224" y="22" width="364" height="86" rx="22" fill="#1CB0F6"/>
  <rect x="224" y="75" width="364" height="33" fill="#1CB0F6"/>
  <text x="406" y="55" text-anchor="middle" font-size="20" font-weight="900" fill="white">Proppy</text>
  <text x="406" y="72" text-anchor="middle" font-size="10" font-weight="700" fill="rgba(255,255,255,.82)">Your chaotic house hunter 🏡</text>
  <!-- Tabs -->
  <rect x="224" y="86" width="364" height="42" fill="white"/>
  <line x1="224" y1="128" x2="588" y2="128" stroke="#EBEBEB" stroke-width="2"/>
  <text x="305" y="112" text-anchor="middle" font-size="12" font-weight="800" fill="#AAA">💬 Chat</text>
  <text x="406" y="112" text-anchor="middle" font-size="12" font-weight="800" fill="#AAA">⭐ Wishlist</text>
  <text x="533" y="112" text-anchor="middle" font-size="12" font-weight="800" fill="#1CB0F6">⚙️ Config</text>
  <line x1="533" y1="126" x2="533" y2="130" stroke="#1CB0F6" stroke-width="3"/>
  <!-- Notice -->
  <rect x="238" y="140" width="336" height="62" rx="12" fill="#FFFBEB" stroke="#F5C518" stroke-width="1.5"/>
  <text x="254" y="162" font-size="13" font-weight="600" fill="#5C4A00">🔑 No server needed — Proppy</text>
  <text x="254" y="178" font-size="13" font-weight="600" fill="#5C4A00">calls Anthropic directly.</text>
  <text x="254" y="194" font-size="13" font-weight="600" fill="#5C4A00">Add your key and she's ready.</text>
  <!-- API key section -->
  <rect x="238" y="214" width="336" height="120" rx="14" fill="white" stroke="#EBEBEB" stroke-width="1.5"/>
  <text x="254" y="234" font-size="11" font-weight="800" fill="#AAAAAA" letter-spacing=".7">ANTHROPIC API KEY</text>
  <rect x="254" y="240" width="306" height="36" rx="10" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1.5"/>
  <text x="266" y="262" font-size="13" fill="#CCC">sk-ant-••••••••••••••••••••</text>
  <!-- status ok -->
  <circle cx="260" cy="294" r="5" fill="#58CC02"/>
  <text x="272" y="298" font-size="12" font-weight="700" fill="#58CC02">API key works ✓ Ready!</text>
  <!-- test button -->
  <rect x="254" y="306" width="306" height="36" rx="10" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1.5"/>
  <text x="407" y="328" text-anchor="middle" font-size="14" font-weight="800" fill="#2C2C2C">Test connection 🔌</text>
  <!-- Notifications section -->
  <rect x="238" y="346" width="336" height="104" rx="14" fill="white" stroke="#EBEBEB" stroke-width="1.5"/>
  <!-- toggle row -->
  <text x="254" y="374" font-size="14" font-weight="700" fill="#2C2C2C">Notify on new listings</text>
  <!-- toggle switch ON -->
  <rect x="520" y="360" width="44" height="24" rx="12" fill="#58CC02" stroke="#3A9900" stroke-width="1.5"/>
  <circle cx="553" cy="372" r="9" fill="white"/>
  <!-- interval -->
  <text x="254" y="406" font-size="11" font-weight="800" fill="#AAAAAA" letter-spacing=".7">SEARCH INTERVAL</text>
  <rect x="254" y="412" width="306" height="30" rx="8" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1.5"/>
  <text x="266" y="431" font-size="13" font-weight="500" fill="#2C2C2C">Every 12 hours</text>
  <text x="546" y="431" font-size="12" fill="#AAA">▼</text>
  <!-- Save config button -->
  <rect x="238" y="462" width="336" height="46" rx="14" fill="#1CB0F6" stroke="#0A91D0" stroke-width="1.5"/>
  <text x="406" y="489" text-anchor="middle" font-size="16" font-weight="900" fill="white">Save config 💾</text>
  <!-- Annotations -->
  <text x="90" y="180" font-size="12" font-weight="600" fill="#555" text-anchor="end">Key stored only</text>
  <text x="90" y="196" font-size="12" font-weight="600" fill="#555" text-anchor="end">in your browser</text>
  <line x1="96" y1="188" x2="234" y2="188" stroke="#F5C518" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="636" y="298" font-size="12" font-weight="600" fill="#58CC02">Green = valid</text>
  <text x="636" y="314" font-size="12" font-weight="600" fill="#555">API key ✓</text>
  <line x1="578" y1="294" x2="630" y2="294" stroke="#58CC02" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="636" y="374" font-size="12" font-weight="600" fill="#555">Background</text>
  <text x="636" y="390" font-size="12" font-weight="600" fill="#555">search alerts</text>
  <line x1="568" y1="372" x2="630" y2="372" stroke="#58CC02" stroke-width="1.5" stroke-dasharray="3,2"/>
</svg>
