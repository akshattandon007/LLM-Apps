[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "namesage"
version = "0.1.0"
description = "AI-powered name analytics — age, gender, nationality, and LLM-synthesised name profiles."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "NameSage Contributors"},
]
dependencies = [
    "httpx>=0.27,<1",
    "rich>=13,<14",
]

[project.urls]
Source = "https://github.com/example/namesage"

[project.optional-dependencies]
dev = [
    "pytest>=7,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-httpx>=0.30,<1",
]

[project.scripts]
namesage = "namesage.cli:main"

[tool.setuptools.packages.find]
include = ["namesage*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"