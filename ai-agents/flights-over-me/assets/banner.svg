<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <radialGradient id="bg" cx="78%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#0e1a18"/>
      <stop offset="55%" stop-color="#080d12"/>
      <stop offset="100%" stop-color="#05070a"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3ff5a5" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3ff5a5" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>

  <!-- engineering grid -->
  <g stroke="#3ff5a5" stroke-opacity="0.05" stroke-width="1">
    <g>
      <line x1="0" y1="40" x2="1200" y2="40"/><line x1="0" y1="80" x2="1200" y2="80"/>
      <line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="160" x2="1200" y2="160"/>
      <line x1="0" y1="200" x2="1200" y2="200"/><line x1="0" y1="240" x2="1200" y2="240"/>
      <line x1="0" y1="280" x2="1200" y2="280"/><line x1="0" y1="320" x2="1200" y2="320"/>
    </g>
    <g>
      <line x1="40" y1="0" x2="40" y2="340"/><line x1="120" y1="0" x2="120" y2="340"/>
      <line x1="200" y1="0" x2="200" y2="340"/><line x1="280" y1="0" x2="280" y2="340"/>
      <line x1="360" y1="0" x2="360" y2="340"/><line x1="440" y1="0" x2="440" y2="340"/>
      <line x1="520" y1="0" x2="520" y2="340"/><line x1="600" y1="0" x2="600" y2="340"/>
      <line x1="680" y1="0" x2="680" y2="340"/><line x1="760" y1="0" x2="760" y2="340"/>
      <line x1="840" y1="0" x2="840" y2="340"/><line x1="920" y1="0" x2="920" y2="340"/>
      <line x1="1000" y1="0" x2="1000" y2="340"/><line x1="1080" y1="0" x2="1080" y2="340"/>
      <line x1="1160" y1="0" x2="1160" y2="340"/>
    </g>
  </g>

  <!-- radar in the upper right -->
  <g transform="translate(940,150)">
    <circle r="120" fill="none" stroke="#3ff5a5" stroke-opacity="0.18"/>
    <circle r="80"  fill="none" stroke="#3ff5a5" stroke-opacity="0.14"/>
    <circle r="40"  fill="none" stroke="#3ff5a5" stroke-opacity="0.12"/>
    <line x1="-120" y1="0" x2="120" y2="0" stroke="#3ff5a5" stroke-opacity="0.1"/>
    <line x1="0" y1="-120" x2="0" y2="120" stroke="#3ff5a5" stroke-opacity="0.1"/>
    <path d="M0 0 L0 -120 A120 120 0 0 1 92 -77 Z" fill="url(#sweep)"/>
    <circle cx="55" cy="-45" r="3.5" fill="#3ff5a5" filter="url(#glow)"/>
    <circle cx="-30" cy="60" r="3" fill="#ffb454"/>
    <circle cx="78" cy="40" r="2.6" fill="#5bd8ff"/>
    <circle r="4" fill="#5bd8ff"/>
  </g>

  <!-- title -->
  <g filter="url(#glow)">
    <text x="70" y="150" font-size="68" font-weight="800" letter-spacing="2" fill="#e8f3f0">FLIGHTS</text>
  </g>
  <text x="70" y="218" font-size="68" font-weight="800" letter-spacing="2" fill="#3ff5a5">OVER ME</text>

  <!-- sub -->
  <text x="74" y="258" font-size="17" letter-spacing="6" fill="#7b8b92" font-family="'Courier New', monospace">// LIVE ADS-B OVERHEAD RADAR + LLM COPILOT</text>

  <!-- little plane streaking across -->
  <g transform="translate(360,300) rotate(-18)" fill="#ffb454" opacity="0.9" filter="url(#glow)">
    <path d="M0 0 c-2 0 -4 2 -4 6 V22 l-32 20 v8 l32 -10 V70 l-8 5 v7 l12 -4 12 4 v-7 l-8 -5 V40 l32 10 v-8 l-32 -20 V6 c0-4 -2-6 -4-6 z"/>
  </g>
  <g stroke="#ffb454" stroke-opacity="0.25" stroke-dasharray="2 6" stroke-width="2" fill="none">
    <line x1="120" y1="318" x2="350" y2="284"/>
  </g>
</svg>
