[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flights-over-me"
version = "1.0.0"
description = "Real-time tracker for the aircraft passing overhead, with an LLM aviation expert. ✈️"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Flights Over Me contributors" }]
keywords = ["aviation", "ads-b", "opensky", "flight-tracker", "fastapi", "llm"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
flights-over-me = "flights_over_me.__main__:main"

[tool.setuptools.packages.find]
include = ["flights_over_me*"]

[tool.setuptools.package-data]
flights_over_me = ["data/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends()/Query() in argument defaults is the idiomatic pattern,
# not the mutable-default-arg bug that B008 normally catches.
"flights_over_me/api/*.py" = ["B008"]
