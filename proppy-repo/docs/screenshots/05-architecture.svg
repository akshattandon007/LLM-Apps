<svg width="800" height="320" viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif">
  <rect width="800" height="320" fill="#FAFAFA" rx="12"/>
  <text x="400" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#333">How Proppy works</text>

  <!-- Box 1: Page + Mascot -->
  <rect x="30" y="56" width="150" height="80" rx="12" fill="#E6F4FF" stroke="#1CB0F6" stroke-width="2"/>
  <text x="105" y="88" text-anchor="middle" font-size="22">🌐</text>
  <text x="105" y="108" text-anchor="middle" font-size="12" font-weight="700" fill="#0A91D0">Any Webpage</text>
  <text x="105" y="124" text-anchor="middle" font-size="11" fill="#0A91D0">Koala mascot</text>
  <text x="105" y="138" text-anchor="middle" font-size="11" fill="#0A91D0">floats here</text>

  <!-- Arrow 1 -->
  <line x1="182" y1="96" x2="228" y2="96" stroke="#1CB0F6" stroke-width="2" marker-end="url(#arr)"/>
  <text x="205" y="88" text-anchor="middle" font-size="10" fill="#666">click</text>

  <!-- Box 2: Content Script (Shadow DOM) -->
  <rect x="230" y="56" width="170" height="80" rx="12" fill="#FFF8E6" stroke="#FF9600" stroke-width="2"/>
  <text x="315" y="82" text-anchor="middle" font-size="11" font-weight="700" fill="#CC6600">content.js</text>
  <text x="315" y="98" text-anchor="middle" font-size="11" fill="#996600">Shadow DOM panel</text>
  <text x="315" y="113" text-anchor="middle" font-size="11" fill="#996600">Chat · Wishlist</text>
  <text x="315" y="128" text-anchor="middle" font-size="11" fill="#996600">Config · Listings</text>

  <!-- Arrow 2 -->
  <line x1="402" y1="96" x2="448" y2="96" stroke="#1CB0F6" stroke-width="2" marker-end="url(#arr)"/>
  <text x="425" y="88" text-anchor="middle" font-size="10" fill="#666">message</text>

  <!-- Box 3: Background SW -->
  <rect x="450" y="56" width="150" height="80" rx="12" fill="#EAFFD6" stroke="#58CC02" stroke-width="2"/>
  <text x="525" y="82" text-anchor="middle" font-size="11" font-weight="700" fill="#3A7A00">background.js</text>
  <text x="525" y="98" text-anchor="middle" font-size="11" fill="#3A7A00">Service Worker</text>
  <text x="525" y="113" text-anchor="middle" font-size="11" fill="#3A7A00">Alarms · Search</text>
  <text x="525" y="128" text-anchor="middle" font-size="11" fill="#3A7A00">Notifications</text>

  <!-- Arrow 3 -->
  <line x1="602" y1="96" x2="648" y2="96" stroke="#58CC02" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="625" y="88" text-anchor="middle" font-size="10" fill="#666">fetch</text>

  <!-- Box 4: Anthropic API -->
  <rect x="650" y="56" width="120" height="80" rx="12" fill="#F1E0FF" stroke="#9E52D4" stroke-width="2"/>
  <text x="710" y="82" text-anchor="middle" font-size="11" font-weight="700" fill="#6A2E9E">Anthropic</text>
  <text x="710" y="98" text-anchor="middle" font-size="11" fill="#6A2E9E">Claude AI</text>
  <text x="710" y="113" text-anchor="middle" font-size="11" fill="#6A2E9E">+ web_search</text>
  <text x="710" y="128" text-anchor="middle" font-size="11" fill="#6A2E9E">tool</text>

  <!-- Bottom flow: web search -->
  <rect x="580" y="188" width="190" height="60" rx="12" fill="#FCF" stroke="#CC82CC" stroke-width="1.5" opacity=".7"/>
  <text x="675" y="212" text-anchor="middle" font-size="11" font-weight="700" fill="#803080">Real-time Web Search</text>
  <text x="675" y="228" text-anchor="middle" font-size="11" fill="#803080">Rightmove · Zoopla</text>
  <text x="675" y="244" text-anchor="middle" font-size="11" fill="#803080">OnTheMarket · more</text>
  <line x1="710" y1="138" x2="710" y2="186" stroke="#9E52D4" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- Storage box -->
  <rect x="200" y="188" width="190" height="60" rx="12" fill="#E8E8E8" stroke="#999" stroke-width="1.5"/>
  <text x="295" y="212" text-anchor="middle" font-size="11" font-weight="700" fill="#555">Chrome Storage</text>
  <text x="295" y="228" text-anchor="middle" font-size="11" fill="#555">Preferences · API key</text>
  <text x="295" y="244" text-anchor="middle" font-size="11" fill="#555">Chat history · Results</text>
  <line x1="315" y1="138" x2="315" y2="186" stroke="#999" stroke-width="1.5" stroke-dasharray="4,2"/>
  <line x1="525" y1="138" x2="295" y2="186" stroke="#999" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- Key: no backend -->
  <rect x="200" y="270" width="400" height="36" rx="10" fill="#E6F4FF" stroke="#1CB0F6" stroke-width="1.5"/>
  <text x="400" y="292" text-anchor="middle" font-size="13" font-weight="700" fill="#0A91D0">✓ Zero backend · No server · Runs entirely in Chrome</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1CB0F6" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
    <marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#58CC02" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
  </defs>
</svg>
