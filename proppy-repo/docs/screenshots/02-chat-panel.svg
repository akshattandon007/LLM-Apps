<svg width="800" height="560" viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif">
  <rect width="800" height="560" fill="#F0EEE8"/>
  <!-- Panel shadow -->
  <rect x="228" y="26" width="364" height="524" rx="22" fill="rgba(0,0,0,.18)"/>
  <!-- Panel body -->
  <rect x="224" y="22" width="364" height="524" rx="22" fill="#F5F5F5"/>
  <!-- Header -->
  <rect x="224" y="22" width="364" height="64" rx="22" fill="#1CB0F6"/>
  <rect x="224" y="64" width="364" height="22" fill="#1CB0F6"/>
  <!-- Header mascot mini -->
  <circle cx="260" cy="54" r="16" fill="#1CB0F6"/>
  <circle cx="251" cy="46" r="8"  fill="#A0C4D8"/>
  <circle cx="269" cy="46" r="8"  fill="#A0C4D8"/>
  <circle cx="260" cy="54" r="15" fill="#1CB0F6"/>
  <polygon points="260,36 248,46 272,46" fill="#FF9600"/>
  <ellipse cx="260" cy="58" rx="6" ry="4" fill="#1A1A2E"/>
  <circle cx="254" cy="52" r="5.5" fill="white"/>
  <circle cx="266" cy="52" r="5.5" fill="white"/>
  <circle cx="255" cy="53" r="3.5" fill="#2C1A0E"/>
  <circle cx="267" cy="53" r="3.5" fill="#2C1A0E"/>
  <circle cx="254" cy="51" r="1.2" fill="white"/>
  <circle cx="266" cy="51" r="1.2" fill="white"/>
  <!-- Header text -->
  <text x="284" y="50" font-size="20" font-weight="900" fill="white" font-family="system-ui">Proppy</text>
  <text x="284" y="65" font-size="10" font-weight="700" fill="rgba(255,255,255,.82)">Your chaotic house hunter 🏡</text>
  <!-- Close button -->
  <rect x="548" y="36" width="28" height="26" rx="8" fill="rgba(255,255,255,.22)" stroke="rgba(255,255,255,.35)" stroke-width="1.5"/>
  <text x="562" y="53" text-anchor="middle" font-size="14" font-weight="900" fill="white">✕</text>
  <!-- Tabs -->
  <rect x="224" y="86" width="364" height="42" fill="white"/>
  <line x1="224" y1="128" x2="588" y2="128" stroke="#EBEBEB" stroke-width="2"/>
  <text x="345" y="112" text-anchor="middle" font-size="12" font-weight="800" fill="#1CB0F6">💬 Chat</text>
  <line x1="345" y1="126" x2="345" y2="130" stroke="#1CB0F6" stroke-width="3"/>
  <text x="466" y="112" text-anchor="middle" font-size="12" font-weight="800" fill="#AAA">⭐ Wishlist</text>
  <text x="560" y="112" text-anchor="middle" font-size="12" font-weight="800" fill="#AAA">⚙️ Config</text>
  <!-- Proppy message 1 -->
  <rect x="238" y="140" width="242" height="100" rx="4" fill="white" stroke="#E8E8E8" stroke-width="1.5"/>
  <rect x="240" y="142" width="238" height="96" rx="4" fill="white"/>
  <text x="252" y="163" font-size="13" font-weight="500" fill="#2C2C2C">Hey there! 👋 I'm <tspan font-weight="700">Proppy</tspan> —</text>
  <text x="252" y="181" font-size="13" font-weight="500" fill="#2C2C2C">your AI house hunter.</text>
  <text x="252" y="207" font-size="13" font-weight="500" fill="#666" font-style="italic">Where are you looking?</text>
  <text x="252" y="252" font-size="11" font-weight="600" fill="#BBBBBB">09:45 am</text>
  <!-- User message -->
  <rect x="360" y="270" width="214" height="44" rx="18" fill="#1CB0F6" stroke="#0A91D0" stroke-width="1.5"/>
  <text x="467" y="296" text-anchor="middle" font-size="13" font-weight="600" fill="white">London, budget £500k</text>
  <text x="566" y="328" text-anchor="end" font-size="11" font-weight="600" fill="#BBBBBB">09:46 am</text>
  <!-- Proppy reply with listing -->
  <rect x="238" y="340" width="280" height="130" rx="4" fill="white" stroke="#E8E8E8" stroke-width="1.5"/>
  <text x="252" y="362" font-size="13" font-weight="500" fill="#2C2C2C">Found 3 great options! 🎉</text>
  <rect x="248" y="372" width="258" height="88" rx="12" fill="white" stroke="#E8E8E8" stroke-width="1.5"/>
  <text x="260" y="389" font-size="10" font-weight="900" fill="#1CB0F6" letter-spacing=".5">RIGHTMOVE</text>
  <text x="260" y="404" font-size="13" font-weight="900" fill="#2C2C2C">🏠 3 bed terraced · Hackney E8</text>
  <text x="260" y="420" font-size="17" font-weight="900" fill="#58CC02">£485,000</text>
  <text x="260" y="434" font-size="11" fill="#888">3 bed · 1 bath · Garden · No chain</text>
  <rect x="260" y="442" width="96" height="24" rx="12" fill="#1CB0F6" stroke="#0A91D0" stroke-width="1.5"/>
  <text x="308" y="458" text-anchor="middle" font-size="11" font-weight="800" fill="white">View listing ↗</text>
  <!-- Input -->
  <rect x="224" y="488" width="364" height="58" fill="white"/>
  <rect x="234" y="498" width="286" height="38" rx="20" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1.5"/>
  <text x="252" y="521" font-size="13" fill="#BBBBBB">Tell Proppy what you're after...</text>
  <circle cx="556" cy="517" r="20" fill="#1CB0F6" stroke="#0A91D0" stroke-width="1.5"/>
  <text x="556" y="523" text-anchor="middle" font-size="15" fill="white">➤</text>
  <!-- Label -->
  <text x="630" y="300" font-size="13" font-weight="600" fill="#666">Chat with</text>
  <text x="630" y="318" font-size="13" font-weight="600" fill="#666">Proppy in</text>
  <text x="630" y="336" font-size="13" font-weight="600" fill="#666">natural language</text>
  <line x1="596" y1="310" x2="624" y2="310" stroke="#1CB0F6" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="630" y="400" font-size="13" font-weight="600" fill="#666">Real listings</text>
  <text x="630" y="418" font-size="13" font-weight="600" fill="#666">with direct</text>
  <text x="630" y="436" font-size="13" font-weight="600" fill="#666">links ↗</text>
  <line x1="519" y1="420" x2="624" y2="420" stroke="#58CC02" stroke-width="1.5" stroke-dasharray="3,2"/>
</svg>
