name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — lint & test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff check)
        working-directory: backend
        run: ruff check .

      - name: Format check (ruff format)
        working-directory: backend
        run: ruff format --check .

      - name: Run tests
        working-directory: backend
        run: pytest --cov=. --cov-report=term-missing

  extension:
    name: Extension — validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Validate manifest.json
        run: |
          python -c "import json; json.load(open('extension/manifest.json'))"
          echo "✓ manifest.json is valid JSON"

      - name: Check all referenced files exist
        run: |
          cd extension
          for f in background.js content.js widget.css popup.html popup.js \
                   icons/icon16.png icons/icon32.png icons/icon48.png icons/icon128.png; do
            if [ ! -f "$f" ]; then
              echo "✗ Missing: $f"
              exit 1
            fi
            echo "✓ $f"
          done

      - name: Set up Node (for JS syntax check)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: JS syntax check
        run: |
          node --check extension/background.js
          node --check extension/content.js
          node --check extension/popup.js
          echo "✓ JS files parse"
