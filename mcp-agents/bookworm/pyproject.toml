[project]
name = "bookworm-mcp"
version = "1.0.0"
description = "MCP server for book search, discovery, and metadata via Open Library"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0,<2",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.scripts]
bookworm = "bookworm.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]