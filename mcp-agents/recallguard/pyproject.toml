[project]
name = "recallguard"
version = "1.0.0"
description = "MCP Agent for checking vehicle safety recalls via the NHTSA API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.scripts]
recallguard = "recallguard.server:main"