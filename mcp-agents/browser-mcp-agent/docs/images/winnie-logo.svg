<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="245" fill="#1a1225" stroke="#f5a623" stroke-width="6" stroke-dasharray="12 6"/>
  
  <!-- Dachshund body — long sausage shape -->
  <ellipse cx="260" cy="300" rx="140" ry="48" fill="#c2703a" stroke="#2a1a0e" stroke-width="4"/>
  
  <!-- Belly highlight -->
  <ellipse cx="260" cy="312" rx="110" ry="24" fill="#d4915a" opacity="0.6"/>
  
  <!-- Back legs -->
  <rect x="355" y="328" width="18" height="50" rx="9" fill="#a85c2e" stroke="#2a1a0e" stroke-width="3"/>
  <rect x="375" y="328" width="18" height="50" rx="9" fill="#c2703a" stroke="#2a1a0e" stroke-width="3"/>
  <!-- Back paws -->
  <ellipse cx="364" cy="380" rx="14" ry="8" fill="#2a1a0e"/>
  <ellipse cx="384" cy="380" rx="14" ry="8" fill="#2a1a0e"/>
  
  <!-- Front legs -->
  <rect x="140" y="325" width="18" height="52" rx="9" fill="#a85c2e" stroke="#2a1a0e" stroke-width="3"/>
  <rect x="162" y="325" width="18" height="52" rx="9" fill="#c2703a" stroke="#2a1a0e" stroke-width="3"/>
  <!-- Front paws -->
  <ellipse cx="149" cy="379" rx="14" ry="8" fill="#2a1a0e"/>
  <ellipse cx="171" cy="379" rx="14" ry="8" fill="#2a1a0e"/>
  
  <!-- Tail — curly and happy -->
  <path d="M395 280 Q 420 250, 410 220 Q 400 195, 420 180" stroke="#c2703a" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M395 280 Q 420 250, 410 220 Q 400 195, 420 180" stroke="#2a1a0e" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.3"/>
  
  <!-- Head -->
  <ellipse cx="115" cy="268" rx="55" ry="50" fill="#c2703a" stroke="#2a1a0e" stroke-width="4"/>
  
  <!-- Snout — the long dachshund nose -->
  <ellipse cx="68" cy="285" rx="38" ry="26" fill="#d4915a" stroke="#2a1a0e" stroke-width="3"/>
  
  <!-- Nose -->
  <ellipse cx="40" cy="280" rx="12" ry="10" fill="#2a1a0e"/>
  <!-- Nose shine -->
  <ellipse cx="37" cy="277" rx="4" ry="3" fill="#5a4a3a" opacity="0.6"/>
  
  <!-- Sniff lines — the dog is sniffing! -->
  <path d="M22 268 Q 10 265, 5 258" stroke="#f5a623" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M20 275 Q 6 275, 0 270" stroke="#f5a623" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M22 283 Q 10 286, 4 282" stroke="#f5a623" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
  
  <!-- Eye -->
  <ellipse cx="105" cy="258" rx="14" ry="16" fill="#fff" stroke="#2a1a0e" stroke-width="2.5"/>
  <ellipse cx="102" cy="257" rx="8" ry="9" fill="#2a1a0e"/>
  <ellipse cx="99" cy="254" rx="3.5" ry="3" fill="#fff"/>
  
  <!-- Eyebrow — expressive -->
  <path d="M88 240 Q 105 232, 122 238" stroke="#2a1a0e" stroke-width="4" stroke-linecap="round" fill="none"/>
  
  <!-- Ear — floppy dachshund ear -->
  <path d="M140 240 Q 175 225, 170 270 Q 165 310, 145 300" fill="#a85c2e" stroke="#2a1a0e" stroke-width="3"/>
  <path d="M148 255 Q 165 248, 162 278" stroke="#8a4c1e" stroke-width="2" fill="none" opacity="0.4"/>
  
  <!-- Mouth — happy smile -->
  <path d="M55 295 Q 72 310, 90 300" stroke="#2a1a0e" stroke-width="3" stroke-linecap="round" fill="none"/>
  
  <!-- Tongue peeking out -->
  <ellipse cx="75" cy="305" rx="8" ry="12" fill="#e85d75" stroke="#2a1a0e" stroke-width="2"/>
  
  <!-- Collar -->
  <rect x="125" y="295" width="50" height="14" rx="7" fill="#f5a623" stroke="#2a1a0e" stroke-width="2.5"/>
  <!-- Collar tag -->
  <circle cx="150" cy="316" r="10" fill="#ffd700" stroke="#2a1a0e" stroke-width="2"/>
  <text x="150" y="320" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a1a0e" font-family="sans-serif">W</text>
  
  <!-- Browser cursor near the nose — the dog is "fetching" web pages -->
  <g transform="translate(14, 210) scale(0.8)">
    <path d="M0 0 L0 28 L7 21 L14 32 L19 29 L12 18 L21 18 Z" fill="#fff" stroke="#2a1a0e" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
  
  <!-- Sparkle stars around Winnie -->
  <g fill="#f5a623">
    <path d="M420 120 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5z" opacity="0.8"/>
    <path d="M340 140 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" opacity="0.5"/>
    <path d="M450 200 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" opacity="0.65"/>
    <path d="M80 170 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z" opacity="0.45"/>
  </g>
  
  <!-- "WINNIE" text arc at the top -->
  <defs>
    <path id="textArc" d="M100 130 Q 256 60, 412 130" fill="none"/>
  </defs>
  <text font-family="'Trebuchet MS', 'Comic Sans MS', cursive" font-size="42" font-weight="bold" fill="#f5a623" letter-spacing="8">
    <textPath href="#textArc" startOffset="50%" text-anchor="middle">WINNIE</textPath>
  </text>
  
  <!-- Subtitle -->
  <text x="256" y="440" text-anchor="middle" font-family="'Trebuchet MS', sans-serif" font-size="18" fill="#8b7a6b" letter-spacing="3">BROWSER AGENT</text>
  
  <!-- Paw prints decoration at bottom -->
  <g fill="#f5a623" opacity="0.3">
    <!-- Left paw -->
    <ellipse cx="180" cy="465" rx="8" ry="10"/>
    <ellipse cx="170" cy="455" rx="4" ry="5"/>
    <ellipse cx="180" cy="452" rx="4" ry="5"/>
    <ellipse cx="190" cy="455" rx="4" ry="5"/>
    <!-- Right paw -->
    <ellipse cx="332" cy="465" rx="8" ry="10"/>
    <ellipse cx="322" cy="455" rx="4" ry="5"/>
    <ellipse cx="332" cy="452" rx="4" ry="5"/>
    <ellipse cx="342" cy="455" rx="4" ry="5"/>
  </g>
</svg>
