[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "breatheasy"
version = "0.1.0"
description = "Is it OK to go outside? Air quality and pollen answers for any place on Earth — zero API keys."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.0",
    "httpx>=0.27",
]

[project.scripts]
breatheasy = "breatheasy.cli:entrypoint"

[tool.setuptools]
packages = ["breatheasy"]

[tool.pytest.ini_options]
testpaths = ["tests"]