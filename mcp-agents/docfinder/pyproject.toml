[project]
name = "docfinder"
version = "1.0.0"
description = "MCP Agent for finding healthcare providers via the NPPES NPI Registry"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.scripts]
docfinder = "docfinder.server:main"